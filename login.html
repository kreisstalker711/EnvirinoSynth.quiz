<!DOCTYPE html>
<html>
<head>
    <title>EnvironoSynth.login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Aladin&family=Aubrey&display=swap" rel="stylesheet"> 
<style>
body {
    font-family: Arial, sans-serif;
    background-color: #6488EA;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

div#AccountDetails{
    background: white;
    padding: 20px 30px;
    border-radius: 10px;
    width: 600px;
    box-shadow: 10px 10px lightblue;

}
div#AccountDetails button {
              background-color: skyblue;
              text-align: center;
              font-size: 20px;
              width: 100%;
              padding: 11px;
              border: 2px solid blue;
             }
div#AccountDetails button:hover {
    background-color: darkblue;
}
 

h1 {
    text-align: center;
    font-size: 30px;
    margin-bottom: 20px;
    color:rgb(119, 131, 208);
    font-family: "Aladin", system-ui;
    font-weight: 550;
    font-style: normal;
}
input {
    width: 40px;

}

p {
    margin: 10px 0;
}

div#AccountDetails input[type="text"] {

    width: 350px;
    padding: 10px 21px;
    margin-top: 5px;
    border: 2px solid blue;
    border-radius: 9px;

}
</style>
</head>
<body>
<div id="AccountDetails">
    <div style="max-width: fit-content; margin-left: auto; margin-right: auto;">
        <h1>Account Login</h1>
        <p>Username:<br> <input type="text" id="username" placeholder="Username"></p>
        <p>Email ID:<br> <input type="text" id="emailID" placeholder="Email ID"></p>
        <p>Contact Number:<br> <input type="text" id="contactno" placeholder="Contact Number"></p>
        <div style="max-width: fit-content; margin-left: auto; margin-right: auto;">
            <button onclick="gotoquiz()">Submit</button>
        </div>
    </div>
</div>


<script>
function accdetails() {
    let username = document.getElementById("username").value;
    let emailid = document.getElementById("emailID").value;
    let contactno = document.getElementById("contactno").value;
    if (username !== "" && emailid !== "" && contactno !== "") {
        localStorage.setItem("username", username);
        return true;
    }
    return false;
}

function gotoquiz() {
    if (accdetails() === true) {
        alert(" 🤖 Support Bot: Hi welcome to Environo.quiz, attend the 10questions properly and earn 1point each.")
        window.location.href = "web.html"; 
    } else {
        alert("Not entered value! Please enter it!!");
    }
}
</script>

</body>
</html>
